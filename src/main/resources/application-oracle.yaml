spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5 # Ideal para o Oracle da FIAP (evita estourar limite de sessões do RM!)
      connection-timeout: 5000
      idle-timeout: 120000
      data-source-properties:
        oracle.net.CONNECT_TIMEOUT: 3000
        oracle.jdbc.ReadTimeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
spring:
  application:
    name: gs-springboot
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:oracle} #Selecionar o banco de dados - h2 ou oracle;
  datasource:
    url: jdbc:h2:mem:gs-springboot
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    mapper:
      accept-case-insensitive-enums: true
app:
  jwt:
    secret: ${JWT_SECRET:cHJvamVjdG1ndC1kZXYtc2VjcmV0LWtleS0zMmJ5dGU}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}   # 8 horas (28.800.000 ms)
  admin:
    email: ${ADMIN_EMAIL:admin@nexa.com}
    password: ${ADMIN_PASSWORD:admin123}
  fila:
    tolerancia-minutos: ${FILA_TOLERANCIA_MINUTOS:20}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
springdoc:
  show-actuator: true
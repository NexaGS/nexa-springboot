<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Documentação da API — Redoc</title>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    />

    <style>
        :root {
            --bg-header: #0f172a;
            --bg-surface: #ffffff;
            --text-header: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-badge: rgba(37, 99, 235, 0.2);
            --accent-border: rgba(96, 165, 250, 0.4);
            --border-color: #1e293b;
            --header-height: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-surface);
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* Topbar moderna e responsiva */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: var(--header-height);
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
            flex-shrink: 0;
        }

        .api-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-header);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .api-version {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: #60a5fa;
            background-color: var(--accent-badge);
            border: 1px solid var(--accent-border);
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            flex-shrink: 0;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: inherit;
            font-size: 0.8125rem;
            font-weight: 500;
            padding: 0.45rem 0.85rem;
            border-radius: 0.5rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .btn-outline {
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--text-header);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Estado de carregamento / erro */
        .status-banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--header-height));
            padding: 2rem;
            text-align: center;
            gap: 1rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            max-width: 540px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 1.5rem;
            border-radius: 0.75rem;
        }

        .error-box h2 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .error-box p {
            font-size: 0.9rem;
            color: #7f1d1d;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            .topbar {
                padding: 0.75rem 1rem;
            }
            .api-title {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <span class="status-dot" title="Especificação OpenAPI dinâmica (/v3/api-docs)"></span>
            <h1 id="header-api-title" class="api-title">Carregando especificação da API...</h1>
            <span id="header-api-version" class="api-version">...</span>
        </div>

        <nav class="topbar-actions" aria-label="Ações da documentação">
            <button type="button" class="btn btn-outline" id="btn-reload" title="Recarregar /v3/api-docs">
                &#x21bb; Atualizar
            </button>
            <a href="/v3/api-docs" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
                OpenAPI JSON
            </a>
            <a href="/swagger-ui.html" class="btn btn-primary">
                Swagger UI
            </a>
        </nav>
    </header>

    <main id="redoc-container">
        <div class="status-banner" id="loading-state">
            <div class="spinner" role="status" aria-label="Carregando"></div>
            <p>Carregando especificação atualizada de <code>/v3/api-docs</code>...</p>
        </div>
    </main>

    <!-- Redoc 3.x Standalone (ES Module) com fallback automático de CDN -->
    <script type="module">
        const OPENAPI_ENDPOINT = '/v3/api-docs';
        const REDOC_CDNS = [
            'https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js',
            'https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js'
        ];

        const titleEl = document.getElementById('header-api-title');
        const versionEl = document.getElementById('header-api-version');
        const containerEl = document.getElementById('redoc-container');
        const reloadBtn = document.getElementById('btn-reload');

        let redocInitFn = null;
        let currentRoot = null;

        const redocOptions = {
            disableSearch: false,
            hideDownloadButton: false,
            hideDownloadButtons: false,
            hideHostname: false,
            expandResponses: '200,201',
            pathInMiddlePanel: true,
            requiredPropsFirst: true,
            sortRequiredPropsFirst: true,
            sortPropsAlphabetically: false,
            nativeScrollbars: false,
            disableTelemetry: true,
            theme: {
                spacing: {
                    unit: 5,
                    sectionHorizontal: 32,
                    sectionVertical: 24
                },
                breakpoints: {
                    small: '50rem',
                    medium: '75rem',
                    large: '105rem'
                },
                colors: {
                    tonalOffset: 0.15,
                    primary: {
                        main: '#2563eb'
                    },
                    success: {
                        main: '#16a34a'
                    },
                    warning: {
                        main: '#d97706'
                    },
                    error: {
                        main: '#dc2626'
                    },
                    text: {
                        primary: '#0f172a',
                        secondary: '#475569'
                    },
                    http: {
                        get: '#16a34a',
                        post: '#2563eb',
                        put: '#d97706',
                        patch: '#7c3aed',
                        delete: '#dc2626',
                        basic: '#64748b',
                        link: '#0284c7',
                        head: '#9333ea'
                    }
                },
                typography: {
                    fontSize: '15px',
                    lineHeight: '1.6',
                    fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
                    headings: {
                        fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
                        fontWeight: '700',
                        lineHeight: '1.3'
                    },
                    code: {
                        fontSize: '13px',
                        fontFamily: "'JetBrains Mono', Consolas, monospace",
                        backgroundColor: '#f1f5f9',
                        color: '#0f172a',
                        wrap: true
                    }
                },
                sidebar: {
                    width: '280px',
                    backgroundColor: '#f8fafc',
                    textColor: '#1e293b',
                    activeTextColor: '#2563eb'
                },
                rightPanel: {
                    backgroundColor: '#0f172a',
                    width: '40%',
                    textColor: '#f8fafc'
                }
            }
        };

        async function resolveRedocInit() {
            if (redocInitFn) {
                return redocInitFn;
            }

            let lastError = null;
            for (const cdnUrl of REDOC_CDNS) {
                try {
                    const mod = await import(cdnUrl);
                    const initFn = mod?.init || window.Redoc?.init;
                    if (typeof initFn === 'function') {
                        redocInitFn = initFn;
                        return redocInitFn;
                    }
                } catch (err) {
                    lastError = err;
                }
            }

            throw new Error(
                `Não foi possível carregar o bundle do Redoc a partir da CDN (${lastError?.message || 'erro desconhecido'})`
            );
        }

        async function loadDocumentation() {
            if (currentRoot && typeof currentRoot.unmount === 'function') {
                try {
                    currentRoot.unmount();
                } catch (_) {
                    // Ignora erro caso já desmontado
                }
                currentRoot = null;
            }

            containerEl.innerHTML = `
                <div class="status-banner">
                    <div class="spinner" role="status" aria-label="Carregando"></div>
                    <p>Sincronizando especificação com <code>${OPENAPI_ENDPOINT}</code>...</p>
                </div>
            `;

            try {
                // Carrega o módulo Redoc e consulta /v3/api-docs em paralelo sem cache
                const [initRedoc, response] = await Promise.all([
                    resolveRedocInit(),
                    fetch(`${OPENAPI_ENDPOINT}?_t=${Date.now()}`, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache'
                        },
                        cache: 'no-store'
                    })
                ]);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} (${response.statusText})`);
                }

                const spec = await response.json();

                // Atualiza título e versão dinamicamente a partir do JSON da especificação
                const apiTitle = spec?.info?.title || 'API Spring Boot';
                const apiVersion = spec?.info?.version || 'v1';

                titleEl.textContent = apiTitle;
                titleEl.title = apiTitle;
                versionEl.textContent = apiVersion.startsWith('v') ? apiVersion : `v${apiVersion}`;
                document.title = `${apiTitle} (${apiVersion}) — Documentação Redoc`;

                containerEl.innerHTML = '<div id="redoc-mount"></div>';
                const mountEl = document.getElementById('redoc-mount');
                currentRoot = initRedoc(spec, redocOptions, mountEl);
            } catch (error) {
                titleEl.textContent = 'Erro ao carregar documentação';
                versionEl.textContent = 'ERRO';
                containerEl.innerHTML = `
                    <div class="status-banner">
                        <div class="error-box">
                            <h2>Não foi possível carregar a especificação da API</h2>
                            <p>
                                Falha ao consultar <code>${OPENAPI_ENDPOINT}</code>: <strong>${error.message}</strong>.<br/>
                                Verifique se a aplicação Spring Boot está em execução e se o endpoint <code>/v3/api-docs</code> está acessível.
                            </p>
                            <button type="button" class="btn btn-primary" onclick="window.reloadApiDocs()">
                                Tentar novamente
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        window.reloadApiDocs = loadDocumentation;
        reloadBtn.addEventListener('click', loadDocumentation);

        loadDocumentation();
    </script>
</body>
</html>
